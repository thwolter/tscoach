[project]
name = "agent"
version = "0.5.0"
description = "Helpline Counsellor Training Agent."
authors = [
    { name = "Thomas Wolter", email = "thwolter@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "langchain>=1.2.15",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.6",
    "langgraph-api>=0.7.100",
    "langgraph-secure-gateway @ git+https://github.com/thwolter/langgraph-secure-gateway.git@main",
    "python-dotenv>=1.0.1",
]


[project.optional-dependencies]
dev = ["pyrefly>=0.61.0", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "commitizen>=4.13.10",
    "commitlint>=1.13.3",
    "isort>=8.0.1",
    "langgraph-cli[inmem]>=0.4.21",
    "pre-commit>=4.5.1",
    "pyrefly>=0.61.0",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "ssort>=0.16.0",
]
