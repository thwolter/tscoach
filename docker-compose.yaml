volumes:
    langgraph-data:
        driver: local
services:
    langgraph-redis:
        image: redis:6
        restart: unless-stopped
        healthcheck:
            test: redis-cli ping
            interval: 5s
            timeout: 1s
            retries: 5
    langgraph-postgres:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - langgraph-data:/var/lib/postgresql/data
        healthcheck:
            test: pg_isready -U postgres
            start_period: 10s
            timeout: 1s
            retries: 5
            interval: 5s
    langgraph-api:
        pull_policy: never
        restart: unless-stopped
        build:
          context: .
          dockerfile: Dockerfile
        image: "langgraph-app"
        expose:
            - "8000"
        depends_on:
            langgraph-redis:
                condition: service_healthy
            langgraph-postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), timeout=3); s.close()"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        environment:
            FORWARDED_ALLOW_IPS: "*"
            REDIS_URI: redis://langgraph-redis:6379
            POSTGRES_URI: postgres://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
            GATEWAY_UPSTREAM_SECRET: ${GATEWAY_UPSTREAM_SECRET:-}
            LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
            LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
            OPENAI_API_KEY: ${OPENAI_API_KEY}
