volumes:
    langgraph-data:
        driver: local
services:
    langgraph-redis:
        image: redis:6
        healthcheck:
            test: redis-cli ping
            interval: 5s
            timeout: 1s
            retries: 5
    langgraph-postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - langgraph-data:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: pg_isready -U postgres
            start_period: 10s
            timeout: 1s
            retries: 5
            interval: 5s
    langgraph-api:
        pull_policy: never
        build:
          context: .
          dockerfile: Dockerfile
        image: "langgraph-app"
        depends_on:
            langgraph-redis:
                condition: service_healthy
            langgraph-postgres:
                condition: service_healthy
        environment:
            FORWARDED_ALLOW_IPS: "*"
            REDIS_URI: redis://langgraph-redis:6379
            POSTGRES_URI: postgres://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
            LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
            OPENAI_API_KEY: ${OPENAI_API_KEY}
    auth-gateway:
        pull_policy: never
        build:
          context: .
          dockerfile: Dockerfile
        image: "langgraph-app"
        entrypoint: ["python", "-m", "uvicorn", "agent.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
            - "8123:8000"
        depends_on:
            langgraph-api:
                condition: service_started
            langgraph-postgres:
                condition: service_healthy
        environment:
            AGENT_API_KEY_PEPPER: ${AGENT_API_KEY_PEPPER}
            POSTGRES_URI: postgres://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
            LANGGRAPH_UPSTREAM_URL: http://langgraph-api:8000
